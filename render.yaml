# Render Blueprint — deploys the FastAPI backend as a free-tier Docker web service.
# Usage: Render dashboard -> New -> Blueprint -> connect this repo.
services:
  - type: web
    name: harsh-and-enzo
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Secrets — Render prompts you to enter these during Blueprint setup.
      - key: OPENCODE_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

      # CORS whitelist — update if you add a custom domain.
      - key: ALLOWED_ORIGINS
        value: https://harsh-and-enzo.vercel.app

      # Model routing (OpenCode model ids)
      - key: QUERY_MODEL
        value: deepseek-v4.1-flash
      - key: EVAL_MODEL
        value: deepseek-v4.1-flash

      # Behavior knobs (match README defaults)
      - key: RATE_LIMIT
        value: "7"
      - key: MAX_LINKS
        value: "25"
      - key: MAX_MATCHES
        value: "8"
      - key: PER_JOB_DELAY
        value: "1.0"
